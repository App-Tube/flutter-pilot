name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages example/counter/lib example/counter/test_driver
      - run: dart analyze packages example
      - run: dart test
        working-directory: packages/flutter_pilot
      - run: flutter test
        working-directory: packages/ai_driver
